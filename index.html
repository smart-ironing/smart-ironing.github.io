  <script>
    // ---------- Supabase Configuration ----------
    let orders = [];
    let draftItems = [];
    let activeSlNo = 100;
    let supportsSlColumn = true;
    const supabaseUrl = "https://cfsaiqgvpopnlhagxvqa.supabase.co";
    const supabaseKey = "sb_publishable_3sWev9-qMw38MDdl1CeS4g_maISPvi4";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function getOrderSlNo(order, indexFromNewest) {
      if (order && order.sl_no !== undefined && order.sl_no !== null && !isNaN(Number(order.sl_no))) {
        return Number(order.sl_no);
      }
      if (order && order.slNo !== undefined && order.slNo !== null && !isNaN(Number(order.slNo))) {
        return Number(order.slNo);
      }
      const total = orders.length;
      if (typeof indexFromNewest === 'number' && indexFromNewest >= 0) {
        return 100 + (total - 1 - indexFromNewest);
      }
      return 100;
    }

    function computeNextSlNo() {
      let maxSl = 99;
      orders.forEach((o, idx) => {
        const sl = getOrderSlNo(o, idx);
        if (sl > maxSl) maxSl = sl;
      });
      return maxSl + 1;
    }

    async function loadOrders() {
      const statusEl = document.getElementById('dbStatus');
      if (statusEl) statusEl.textContent = 'Syncing with cloud database...';

      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error loading orders:', error);
        if (statusEl) statusEl.textContent = 'Sync error: ' + error.message;
      } else {
        orders = data || [];
        if (orders.length > 0) {
          supportsSlColumn = ('sl_no' in orders[0]) || ('slNo' in orders[0]);
        }
        if (statusEl) statusEl.textContent = `Connected • ${orders.length} shared orders`;
        if (document.getElementById('searchDiv').style.display === 'block') {
          const currentQuery = document.getElementById('searchQuery').value.trim();
          if (currentQuery !== '') {
            performSearch();
          }
        }
      }
    }

    supabaseClient
      .channel('public:orders')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
        loadOrders();
      })
      .subscribe();

    async function saveOrderToSupabase(order) {
      const payload = { ...order };
      if (!supportsSlColumn) {
        delete payload.sl_no;
      }

      let { error } = await supabaseClient
        .from('orders')
        .insert([payload]);

      if (error && 'sl_no' in payload) {
        supportsSlColumn = false;
        const fallbackPayload = { ...order };
        delete fallbackPayload.sl_no;
        const retry = await supabaseClient
          .from('orders')
          .insert([fallbackPayload]);
        error = retry.error;
      }

      if (error) {
        console.error('Error saving order:', error);
        alert('Failed to save to cloud database: ' + error.message);
      } else {
        await loadOrders();
        alert(`Order #${order.sl_no} saved to shared database!`);
        showHome();
      }
    }

    async function deleteOldOrders() {
      const cutoffDate = new Date();
      cutoffDate.setDate(cutoffDate.getDate() - 45);
      const cutoffStr = cutoffDate.toISOString().split('T')[0];

      const confirmDelete = confirm(
        `This will permanently delete all orders dated before ${cutoffStr} (strictly older than 45 days).\n\nDo you want to continue?`
      );
      if (!confirmDelete) return;

      const { data, error } = await supabaseClient
        .from('orders')
        .delete()
        .lt('date', cutoffStr)
        .select();

      if (error) {
        console.error('Error deleting old orders:', error);
        alert('Failed to delete old orders: ' + error.message);
      } else {
        const deletedCount = data ? data.length : 0;
        alert(`Cleanup complete! Deleted ${deletedCount} order(s) older than 45 days.`);
        await loadOrders();
      }
    }

    // ---------- Item lists ----------
    const laundryClothList = [
      { name: 'Shirt', dc: 90, pl: 60 },
      { name: 'Juba Polyster', dc: 150, pl: 100 },
      { name: 'Dhothi', dc: 80, pl: 60 },
      { name: 'Pants', dc: 90, pl: 70 },
      { name: 'Saree', dc: 150, pl: 120 },
      { name: 'Kerala Set Mundu', dc: 150, pl: 120 },
      { name: 'Blouse', dc: 50, pl: 35 },
      { name: 'Under Skirt', dc: 60, pl: 30 },
      { name: 'Under garments', dc: 60, pl: 30 },
      { name: 'Salwar Kammes Set', dc: 150, pl: 100 },
      { name: 'Salwar Kammes Top', dc: 90, pl: 60 },
      { name: 'Salwar Karnmes Bottom', dc: 50, pl: 30 },
      { name: 'Salwar Kammes Shawl', dc: 60, pl: 30 },
      { name: 'Nighty', dc: 60, pl: 30 },
      { name: 'Bed Sheet Single', dc: 75, pl: 60 },
      { name: 'Bed Sheet Double', dc: 90, pl: 80 },
      { name: 'Piliow Case', dc: 40, pl: 30 },
      { name: 'Bath Toweis', dc: 40, pl: 30 },
      { name: 'Curtains Single / Panel', dc: 150, pl: 125 },
      { name: 'Curtains double / Panel with Lining', dc: 200, pl: 175 },
      { name: 'Blankets Single', dc: 210, pl: 125 },
      { name: 'Blankets Double', dc: 250, pl: 175 },
      { name: 'Comforter', dc: 225, pl: 175 },
      { name: 'Other services', dc: 210, pl: 0 },
      { name: 'Others', price: 0 }
    ];
    const ironingClothList = [
      { name: 'Saree', price: 40 },
      { name: 'Pant', price: 20 },
      { name: 'Shirt', price: 20 },
      { name: 'Churidar', price: 35 },
      { name: 'Top', price: 20 },
      { name: 'Blouse', price: 15 },
      { name: 'Dothi', price: 20 },
      { name: 'Suit', price: 50 },
      { name: 'Pattu Pavada', price: 40 },
      { name: 'Set Mundu', price: 40 },
      { name: 'Juba', price: 25 },
      { name: 'Starch Saree', price: 45 },
      { name: 'Starch Shirt', price: 25 },
      { name: 'Others', price: 0 }
    ];
    let currentClothList = laundryClothList;

    function populateClothSelect() {
      const select = document.getElementById('clothSelect');
      select.innerHTML = '';
      currentClothList.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        select.appendChild(opt);
      });
    }

    function getCurrentItemSelection() {
      const cloth = document.getElementById('clothSelect').value;
      const customName = document.getElementById('customName').value.trim();
      const customPrice = parseFloat(document.getElementById('customPrice').value) || 0;
      const quantity = parseInt(document.getElementById('quantity').value) || 0;

      let materialDesc = cloth;
      let unitPrice = 0;

      if (cloth === 'Others') {
        materialDesc = customName || 'Other';
        unitPrice = customPrice;
      } else {
        const item = currentClothList.find(c => c.name === cloth);
        if (item && ('dc' in item)) {
          const selectedRate = document.querySelector('input[name="rateOption"]:checked').value;
          unitPrice = selectedRate === 'dc' ? item.dc : item.pl;
          materialDesc = `${cloth} (${selectedRate.toUpperCase()})`;
        } else {
          unitPrice = item ? item.price : 0;
        }
      }

      return {
        material: materialDesc,
        quantity,
        unitPrice,
        amount: unitPrice * quantity
      };
    }

    function handleRateChange() {
      const select = document.getElementById('clothSelect');
      if (select.value === 'Others') return;
      const item = currentClothList.find(c => c.name === select.value);
      const selectedRate = document.querySelector('input[name="rateOption"]:checked').value;
      const price = selectedRate === 'dc' ? item.dc : item.pl;
      document.getElementById('unitPrice').textContent = price !== undefined ? price : '0';
      computeTotal();
    }

    function onClothChange() {
      const select = document.getElementById('clothSelect');
      const chosen = select.value;
      const customDiv = document.getElementById('customClothDiv');
      const rateDiv = document.getElementById('rateDiv');
      const priceSpan = document.getElementById('unitPrice');

      if (chosen === 'Others') {
        customDiv.style.display = 'block';
        rateDiv.style.display = 'none';
        priceSpan.textContent = document.getElementById('customPrice').value || '0';
      } else {
        customDiv.style.display = 'none';
        const item = currentClothList.find(c => c.name === chosen);
        if (item && ('dc' in item)) {
          rateDiv.style.display = 'block';
          const selectedRate = document.querySelector('input[name="rateOption"]:checked').value;
          const price = selectedRate === 'dc' ? item.dc : item.pl;
          priceSpan.textContent = price !== undefined ? price : '0';
        } else {
          rateDiv.style.display = 'none';
          priceSpan.textContent = item ? item.price : '0';
        }
      }
      computeTotal();
    }

    function computeTotal() {
      const qty = parseInt(document.getElementById('quantity').value) || 0;
      if (document.getElementById('clothSelect').value === 'Others') {
        document.getElementById('unitPrice').textContent = document.getElementById('customPrice').value || '0';
      }
      const unitPrice = parseFloat(document.getElementById('unitPrice').textContent) || 0;
      const currentItemTotal = qty * unitPrice;
      document.getElementById('itemSubtotal').textContent = isNaN(currentItemTotal) ? '0.00' : currentItemTotal.toFixed(2);

      const addedItemsTotal = draftItems.reduce((sum, it) => sum + it.amount, 0);
      const grandTotal = addedItemsTotal + (draftItems.length === 0 ? currentItemTotal : 0);
      document.getElementById('totalAmount').textContent = isNaN(grandTotal) ? '0.00' : grandTotal.toFixed(2);
    }

    function renderDraftItems() {
      const listEl = document.getElementById('draftItemsList');
      const boxEl = document.getElementById('draftItemsBox');
      listEl.innerHTML = '';

      if (draftItems.length === 0) {
        boxEl.style.display = 'none';
        computeTotal();
        return;
      }

      boxEl.style.display = 'block';
      draftItems.forEach((it, index) => {
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <span><strong>${it.material}</strong> × ${it.quantity} @ ₹${it.unitPrice} = <strong>₹${it.amount.toFixed(2)}</strong></span>
          <button type="button" class="remove-btn" onclick="removeDraftItem(${index})">Remove</button>
        `;
        listEl.appendChild(row);
      });

      const addedTotal = draftItems.reduce((sum, it) => sum + it.amount, 0);
      document.getElementById('draftItemsTotal').textContent = addedTotal.toFixed(2);
      document.getElementById('totalAmount').textContent = addedTotal.toFixed(2);
    }

    function addItemToOrder() {
      const sel = getCurrentItemSelection();
      if (!sel.material || sel.quantity <= 0) {
        alert('Please select a valid item and enter quantity > 0.');
        return;
      }
      if (document.getElementById('clothSelect').value === 'Others' && sel.unitPrice <= 0) {
        alert('Please enter a custom unit price > 0.');
        return;
      }

      draftItems.push(sel);
      document.getElementById('customName').value = '';
      document.getElementById('customPrice').value = '';
      document.getElementById('quantity').value = 1;
      onClothChange();
      renderDraftItems();
    }

    function removeDraftItem(index) {
      draftItems.splice(index, 1);
      renderDraftItems();
    }

    function formatCombinedOrder(items) {
      if (items.length === 1) {
        return {
          material: items[0].material,
          quantity: items[0].quantity,
          unitPrice: items[0].unitPrice,
          amount: items[0].amount
        };
      }
      const combinedMaterial = items.map(i => `${i.material} (${i.quantity}×₹${i.unitPrice})`).join(', ');
      const totalQty = items.reduce((sum, i) => sum + i.quantity, 0);
      const totalAmount = items.reduce((sum, i) => sum + i.amount, 0);
      const avgUnitPrice = totalQty > 0 ? Number((totalAmount / totalQty).toFixed(2)) : 0;
      return {
        material: combinedMaterial,
        quantity: totalQty,
        unitPrice: avgUnitPrice,
        amount: totalAmount
      };
    }

    async function saveOrder() {
      const service = document.getElementById('orderForm').dataset.service;
      const name = document.getElementById('custName').value.trim();
      const mobile = document.getElementById('custMobile').value.trim();
      const date = document.getElementById('orderDate').value;

      let itemsToSave = [...draftItems];
      if (itemsToSave.length === 0) {
        const current = getCurrentItemSelection();
        if (!current.material || current.quantity <= 0) {
          alert('Please fill all required fields and ensure quantity is > 0');
          return;
        }
        itemsToSave.push(current);
      }

      if (!name || !mobile || !date) {
        alert('Please enter Customer Name, Mobile Number, and Date.');
        return;
      }

      const summary = formatCombinedOrder(itemsToSave);
      const order = {
        id: Date.now(),
        sl_no: activeSlNo,
        service,
        name,
        mobile,
        date,
        material: summary.material,
        quantity: summary.quantity,
        unitPrice: summary.unitPrice,
        amount: summary.amount
      };

      await saveOrderToSupabase(order);
    }

    function parseBreakdownFromMaterial(materialStr) {
      if (!materialStr) return null;
      const parts = materialStr.split(',').map(p => p.trim()).filter(Boolean);
      if (parts.length === 0) return null;

      const parsed = [];
      for (const part of parts) {
        const match = part.match(/^(.*?)\s*\(\s*(\d+)\s*[×x*]\s*₹?\s*(\d+(?:\.\d+)?)\s*\)$/i);
        if (!match) return null;
        parsed.push({
          name: match[1].trim(),
          qty: parseInt(match[2], 10),
          price: parseFloat(match[3])
        });
      }
      return parsed;
    }

    function calculateEditedOrderValues(materialStr, fallbackQty, fallbackUnitPrice) {
      const parsedItems = parseBreakdownFromMaterial(materialStr);
      if (parsedItems && parsedItems.length > 0) {
        const totalQty = parsedItems.reduce((sum, it) => sum + it.qty, 0);
        const totalAmount = Number(parsedItems.reduce((sum, it) => sum + (it.qty * it.price), 0).toFixed(2));
        const avgUnitPrice = totalQty > 0 ? Number((totalAmount / totalQty).toFixed(2)) : 0;
        return {
          hasBreakdown: true,
          quantity: totalQty,
          unitPrice: avgUnitPrice,
          amount: totalAmount
        };
      }

      const qty = parseInt(fallbackQty, 10) || 0;
      const unitPrice = parseFloat(fallbackUnitPrice) || 0;
      const amount = Number((qty * unitPrice).toFixed(2));
      return {
        hasBreakdown: false,
        quantity: qty,
        unitPrice,
        amount
      };
    }

    function performSearch() {
      const q = document.getElementById('searchQuery').value.trim().toLowerCase();
      const container = document.getElementById('searchResults');
      container.innerHTML = '';

      if (q === '') {
        container.textContent = 'Enter a SL No., name, or mobile number to search.';
        return;
      }

      const results = orders
        .map((o, idx) => ({ order: o, slNo: getOrderSlNo(o, idx) }))
        .filter(({ order: o, slNo }) => {
          const name = (o.name || '').toLowerCase();
          const mobile = (o.mobile || '').toLowerCase();
          const slStr = String(slNo);
          return name.includes(q) || mobile.includes(q) || slStr.includes(q);
        });

      if (results.length === 0) {
        container.textContent = 'No matching orders found.';
        return;
      }

      results.forEach(({ order: o, slNo }) => {
        const div = document.createElement('div');
        div.style.border = '1px solid #ccc';
        div.style.borderRadius = '6px';
        div.style.padding = '10px';
        div.style.marginBottom = '10px';
        const amountStr = (o.amount !== undefined && o.amount !== null) ? Number(o.amount).toFixed(2) : '0.00';
        const currentUnitPrice = (o.unitPrice !== undefined && o.unitPrice !== null)
          ? o.unitPrice
          : ((o.unit_price !== undefined && o.unit_price !== null) ? o.unit_price : 0);
        const hasBreakdown = Boolean(parseBreakdownFromMaterial(o.material));
        const isPaid = isOrderPaid(o);

        div.innerHTML = `
          <div class="sl-inline">SL No: ${slNo}${isPaid ? '<span class="paid-badge">PAID</span>' : ''}</div>
          <strong>${o.name}</strong> – ${o.mobile}<br>
          ${o.service} on ${o.date}<br>
          ${o.material} • Count: <strong>${o.quantity}</strong> = <strong>₹${amountStr}</strong><br>
          <div class="order-actions">
            <div class="order-actions-left">
              <button type="button" class="small-btn primary" onclick="showReceipt(${o.id}, ${slNo})">View Receipt</button>
              <button type="button" class="small-btn secondary" onclick="toggleEditOrder(${o.id})">Edit Count / Order</button>
            </div>
            <label class="paid-box ${isPaid ? 'is-paid' : ''}" title="Tick to mark Paid, untick to mark Unpaid">
              <input type="checkbox" ${isPaid ? 'checked' : ''} onchange="toggleOrderPaid(${o.id}, this.checked)">
              <span>${isPaid ? 'Paid ✓' : 'Paid'}</span>
            </label>
          </div>
          <div id="editBox-${o.id}" class="edit-panel" style="display:none;">
            <label style="font-size:13px;">Customer Name</label>
            <input type="text" id="editName-${o.id}" value="${escapeHtml(o.name)}" style="margin-bottom:8px;">
            <label style="font-size:13px;">Mobile Number</label>
            <input type="text" id="editMobile-${o.id}" value="${escapeHtml(o.mobile)}" style="margin-bottom:8px;">
            <label style="font-size:13px;">Items / Material</label>
            <input type="text" id="editMaterial-${o.id}" value="${escapeHtml(o.material)}" oninput="syncEditInputs(${o.id})" style="margin-bottom:4px;">
            <div class="hint">Tip: Change any count inside parentheses, e.g. Saree (1×₹40) → Saree (3×₹40), to recalculate the price automatically.</div>
            <div class="cart-box" style="margin:8px 0; background:#fff;">
              <div style="font-weight:bold; font-size:13px; margin-bottom:6px;">Add / Change Item</div>
              <label style="font-size:13px;">Item</label>
              <select id="editClothSelect-${o.id}" onchange="onEditClothChange(${o.id})" style="margin-bottom:6px;"></select>
              <div id="editCustomClothDiv-${o.id}" style="display:none; margin-bottom:6px;">
                <label style="font-size:13px;">Custom Item Name</label>
                <input type="text" id="editCustomName-${o.id}" placeholder="e.g., Silk Scarf" style="margin-bottom:4px;">
                <label style="font-size:13px;">Custom Unit Price (₹)</label>
                <input type="number" step="0.01" id="editCustomPrice-${o.id}" placeholder="e.g., 150" oninput="updateEditAddSubtotal(${o.id})">
              </div>
              <div id="editRateDiv-${o.id}" style="display:none; margin-bottom:6px;">
                <label style="font-size:13px;">Rate Type</label>
                <input type="radio" id="editRateDC-${o.id}" name="editRateOption-${o.id}" value="dc" checked onchange="onEditClothChange(${o.id})">
                <label for="editRateDC-${o.id}" class="inline-label">DC Rate</label>
                <input type="radio" id="editRatePL-${o.id}" name="editRateOption-${o.id}" value="pl" onchange="onEditClothChange(${o.id})">
                <label for="editRatePL-${o.id}" class="inline-label">PL Rate</label>
              </div>
              <label style="font-size:13px;">Quantity</label>
              <input type="number" id="editAddQty-${o.id}" min="1" value="1" oninput="updateEditAddSubtotal(${o.id})" style="margin-bottom:6px;">
              <div style="font-size:13px; margin-bottom:6px;">
                <strong>Unit Price (₹): </strong><span id="editAddUnitPrice-${o.id}">0</span> •
                <strong>Item Subtotal (₹): </strong><span id="editAddSubtotal-${o.id}">0.00</span>
              </div>
              <button type="button" class="small-btn secondary" onclick="applyEditOrderItem(${o.id}, 'add')">+ Add Item</button>
              <button type="button" class="small-btn primary" onclick="applyEditOrderItem(${o.id}, 'replace')">Replace Items</button>
            </div>
            <label style="font-size:13px;">Cloth Count (Quantity)</label>
            <input type="number" id="editQty-${o.id}" min="1" value="${o.quantity}" ${hasBreakdown ? 'readonly style="background:#eee; margin-bottom:8px;"' : 'style="margin-bottom:8px;"'} oninput="previewEditedAmount(${o.id})">
            <div id="editUnitPriceWrap-${o.id}" style="${hasBreakdown ? 'display:none;' : ''} margin-bottom:8px;">
              <label style="font-size:13px;">Unit Price (₹)</label>
              <input type="number" step="0.01" id="editUnitPrice-${o.id}" min="0" value="${currentUnitPrice}" oninput="previewEditedAmount(${o.id})">
            </div>
            <div style="font-size:14px; margin-bottom:8px;">
              <strong>Updated Amount (₹): </strong><span id="editPreviewAmount-${o.id}">${amountStr}</span>
            </div>
            <button type="button" class="small-btn success" onclick="saveEditedOrder(${o.id})">Save Changes</button>
            <button type="button" class="small-btn" onclick="toggleEditOrder(${o.id})">Cancel</button>
          </div>
        `;

        container.appendChild(div);
        populateEditClothSelect(o.id, o.service);
        onEditClothChange(o.id);
      });
    }

    function getClothListForService(service) {
      return service === 'Ironing' ? ironingClothList : laundryClothList;
    }

    function populateEditClothSelect(id, service) {
      const select = document.getElementById(`editClothSelect-${id}`);
      if (!select) return;
      select.innerHTML = '';
      getClothListForService(service).forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        select.appendChild(opt);
      });
    }

    function onEditClothChange(id) {
      const select = document.getElementById(`editClothSelect-${id}`);
      if (!select) return;
      const targetOrder = orders.find(x => String(x.id) === String(id));
      const list = getClothListForService(targetOrder ? targetOrder.service : 'Ironing');
      const chosen = select.value;
      const customDiv = document.getElementById(`editCustomClothDiv-${id}`);
      const rateDiv = document.getElementById(`editRateDiv-${id}`);
      const priceSpan = document.getElementById(`editAddUnitPrice-${id}`);

      if (chosen === 'Others') {
        customDiv.style.display = 'block';
        rateDiv.style.display = 'none';
        priceSpan.textContent = document.getElementById(`editCustomPrice-${id}`).value || '0';
      } else {
        customDiv.style.display = 'none';
        const item = list.find(c => c.name === chosen);
        if (item && ('dc' in item)) {
          rateDiv.style.display = 'block';
          const checkedRate = document.querySelector(`input[name="editRateOption-${id}"]:checked`);
          const selectedRate = checkedRate ? checkedRate.value : 'dc';
          const price = selectedRate === 'dc' ? item.dc : item.pl;
          priceSpan.textContent = price !== undefined ? price : '0';
        } else {
          rateDiv.style.display = 'none';
          priceSpan.textContent = item ? item.price : '0';
        }
      }
      updateEditAddSubtotal(id);
    }

    function updateEditAddSubtotal(id) {
      const select = document.getElementById(`editClothSelect-${id}`);
      if (!select) return;
      const qty = parseInt(document.getElementById(`editAddQty-${id}`).value, 10) || 0;
      if (select.value === 'Others') {
        document.getElementById(`editAddUnitPrice-${id}`).textContent = document.getElementById(`editCustomPrice-${id}`).value || '0';
      }
      const unitPrice = parseFloat(document.getElementById(`editAddUnitPrice-${id}`).textContent) || 0;
      const subtotal = qty * unitPrice;
      document.getElementById(`editAddSubtotal-${id}`).textContent = isNaN(subtotal) ? '0.00' : subtotal.toFixed(2);
    }

    function applyEditOrderItem(id, mode) {
      const select = document.getElementById(`editClothSelect-${id}`);
      if (!select) return;
      const targetOrder = orders.find(x => String(x.id) === String(id));
      const list = getClothListForService(targetOrder ? targetOrder.service : 'Ironing');
      const cloth = select.value;
      const customName = document.getElementById(`editCustomName-${id}`).value.trim();
      const customPrice = parseFloat(document.getElementById(`editCustomPrice-${id}`).value) || 0;
      const qty = parseInt(document.getElementById(`editAddQty-${id}`).value, 10) || 0;

      let materialDesc = cloth;
      let unitPrice = 0;

      if (cloth === 'Others') {
        materialDesc = customName || 'Other';
        unitPrice = customPrice;
      } else {
        const item = list.find(c => c.name === cloth);
        if (item && ('dc' in item)) {
          const checkedRate = document.querySelector(`input[name="editRateOption-${id}"]:checked`);
          const selectedRate = checkedRate ? checkedRate.value : 'dc';
          unitPrice = selectedRate === 'dc' ? item.dc : item.pl;
          materialDesc = `${cloth} (${selectedRate.toUpperCase()})`;
        } else {
          unitPrice = item ? item.price : 0;
        }
      }

      if (!materialDesc || qty <= 0) {
        alert('Please select a valid item and enter quantity > 0.');
        return;
      }
      if (cloth === 'Others' && unitPrice <= 0) {
        alert('Please enter a custom unit price > 0.');
        return;
      }

      const newEntry = `${materialDesc} (${qty}×₹${unitPrice})`;
      const matInput = document.getElementById(`editMaterial-${id}`);
      const currentMat = matInput.value.trim();

      if (mode === 'replace' || !currentMat) {
        matInput.value = newEntry;
      } else if (parseBreakdownFromMaterial(currentMat)) {
        matInput.value = `${currentMat}, ${newEntry}`;
      } else {
        const existingQty = parseInt(document.getElementById(`editQty-${id}`).value, 10) || 1;
        const existingUnitPrice = parseFloat(document.getElementById(`editUnitPrice-${id}`).value) || 0;
        matInput.value = `${currentMat} (${existingQty}×₹${existingUnitPrice}), ${newEntry}`;
      }

      document.getElementById(`editCustomName-${id}`).value = '';
      document.getElementById(`editCustomPrice-${id}`).value = '';
      document.getElementById(`editAddQty-${id}`).value = 1;
      onEditClothChange(id);
      syncEditInputs(id);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function toggleEditOrder(id) {
      const box = document.getElementById(`editBox-${id}`);
      if (!box) return;
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      if (box.style.display === 'block') {
        onEditClothChange(id);
        syncEditInputs(id);
      }
    }

    function syncEditInputs(id) {
      const materialVal = document.getElementById(`editMaterial-${id}`).value;
      const qtyInput = document.getElementById(`editQty-${id}`);
      const unitWrap = document.getElementById(`editUnitPriceWrap-${id}`);
      const unitInput = document.getElementById(`editUnitPrice-${id}`);

      const calc = calculateEditedOrderValues(materialVal, qtyInput.value, unitInput.value);
      if (calc.hasBreakdown) {
        qtyInput.value = calc.quantity;
        qtyInput.readOnly = true;
        qtyInput.style.background = '#eee';
        unitWrap.style.display = 'none';
        unitInput.value = calc.unitPrice;
        document.getElementById(`editPreviewAmount-${id}`).textContent = calc.amount.toFixed(2);
      } else {
        qtyInput.readOnly = false;
        qtyInput.style.background = '#fff';
        unitWrap.style.display = 'block';
        previewEditedAmount(id);
      }
    }

    function previewEditedAmount(id) {
      const materialVal = document.getElementById(`editMaterial-${id}`).value;
      const qtyInput = document.getElementById(`editQty-${id}`);
      const unitInput = document.getElementById(`editUnitPrice-${id}`);
      const calc = calculateEditedOrderValues(materialVal, qtyInput.value, unitInput.value);
      document.getElementById(`editPreviewAmount-${id}`).textContent = isNaN(calc.amount) ? '0.00' : calc.amount.toFixed(2);
    }

    async function saveEditedOrder(id) {
      const newName = document.getElementById(`editName-${id}`).value.trim();
      const newMobile = document.getElementById(`editMobile-${id}`).value.trim();
      const newMaterial = document.getElementById(`editMaterial-${id}`).value.trim();
      const rawQty = document.getElementById(`editQty-${id}`).value;
      const rawUnitPrice = document.getElementById(`editUnitPrice-${id}`).value;

      const calc = calculateEditedOrderValues(newMaterial, rawQty, rawUnitPrice);

      if (!newName || !newMobile || !newMaterial || calc.quantity <= 0 || isNaN(calc.unitPrice) || calc.unitPrice < 0 || isNaN(calc.amount)) {
        alert('Please enter valid customer name, mobile number, item details, a count greater than 0, and a valid price.');
        return;
      }

      const targetOrder = orders.find(x => String(x.id) === String(id));
      const matchId = targetOrder ? targetOrder.id : id;
      const usesSnakeCaseUnitPrice = targetOrder && ('unit_price' in targetOrder) && !('unitPrice' in targetOrder);

      const updatePayload = {
        name: newName,
        mobile: newMobile,
        material: newMaterial,
        quantity: calc.quantity,
        amount: calc.amount
      };
      if (usesSnakeCaseUnitPrice) {
        updatePayload.unit_price = calc.unitPrice;
      } else {
        updatePayload.unitPrice = calc.unitPrice;
      }

      const { data, error } = await supabaseClient
        .from('orders')
        .update(updatePayload)
        .eq('id', matchId)
        .select();

      if (error) {
        console.error('Error updating order:', error);
        alert('Failed to update order: ' + error.message);
        return;
      }

      if (!data || data.length === 0) {
        alert('Update did not save to Supabase (0 rows matched or UPDATE permission is blocked by Row Level Security). Check your Supabase UPDATE policy on the orders table.');
        return;
      }

      await loadOrders();
      alert(`Order updated! New count: ${calc.quantity}, New amount: ₹${calc.amount.toFixed(2)}`);
    }

    const PAID_STORAGE_KEY = 'smart_ironing_paid_orders_v1';
    let paidColumnWarned = false;

    function getLocalPaidMap() {
      try {
        return JSON.parse(localStorage.getItem(PAID_STORAGE_KEY) || '{}');
      } catch (e) {
        return {};
      }
    }

    function setLocalPaidStatus(id, isPaid) {
      try {
        const map = getLocalPaidMap();
        if (isPaid) {
          map[String(id)] = true;
        } else {
          delete map[String(id)];
        }
        localStorage.setItem(PAID_STORAGE_KEY, JSON.stringify(map));
      } catch (e) {
        console.warn('Could not persist paid status locally:', e);
      }
    }

    function isOrderPaid(order) {
      if (!order) return false;
      if ('paid' in order && order.paid !== null && order.paid !== undefined) {
        return Boolean(order.paid);
      }
      return Boolean(getLocalPaidMap()[String(order.id)]);
    }

    async function toggleOrderPaid(id, isPaid) {
      const targetOrder = orders.find(x => String(x.id) === String(id));
      const matchId = targetOrder ? targetOrder.id : id;

      setLocalPaidStatus(matchId, isPaid);
      if (targetOrder) {
        targetOrder.paid = isPaid;
      }

      const { error } = await supabaseClient
        .from('orders')
        .update({ paid: isPaid })
        .eq('id', matchId);

      if (error) {
        console.warn('Supabase paid update fallback to localStorage:', error.message);
        if (!paidColumnWarned) {
          paidColumnWarned = true;
          alert('Paid status updated on this device. To sync Paid status across all devices, add a boolean column named "paid" (default false) to your Supabase "orders" table.');
        }
      }

      performSearch();
    }

    function showReceipt(id, explicitSl) {
      const idx = orders.findIndex(x => x.id === id);
      if (idx === -1) return;
      const o = orders[idx];
      const slNo = explicitSl !== undefined ? explicitSl : getOrderSlNo(o, idx);
      const isPaid = isOrderPaid(o);

      const rawMobile = (o.mobile || '').toString().trim();
      const dialNumber = rawMobile.replace(/[^+\d]/g, '');

      document.getElementById('receiptSlNo').innerHTML = `SL No: ${slNo}${isPaid ? '<span class="paid-badge">PAID</span>' : ''}`;
      document.getElementById('receiptBody').innerHTML = `
        <div class="receipt-row"><strong>Service:</strong> ${escapeHtml(o.service)}</div>
        <div class="receipt-row"><strong>Name:</strong> ${escapeHtml(o.name)}</div>
        <div class="receipt-row"><strong>Mobile:</strong> ${escapeHtml(o.mobile)}${dialNumber ? ` <a href="tel:${dialNumber}" class="small-btn success" style="text-decoration:none; border-radius:4px; margin-left:8px; padding:3px 10px;">Call</a>` : ''}</div>
        <div class="receipt-row"><strong>Date:</strong> ${escapeHtml(o.date)}</div>
        <div class="receipt-row"><strong>Item(s):</strong> ${escapeHtml(o.material)}</div>
        <div class="receipt-row"><strong>Count / Quantity:</strong> ${o.quantity}</div>
        <div class="receipt-row" style="font-size:17px;"><strong>Amount:</strong> ₹${Number(o.amount).toFixed(2)}</div>
        ${isPaid ? '<div class="receipt-row" style="color:#2e7d32; font-weight:bold;"><strong>Payment:</strong> PAID</div>' : ''}
      `;

      document.getElementById('receiptModal').style.display = 'flex';
    }

    function closeReceipt() {
      document.getElementById('receiptModal').style.display = 'none';
    }

    function showHome() {
      document.getElementById('orderFormDiv').style.display = 'none';
      document.getElementById('searchDiv').style.display = 'none';
      document.getElementById('adminLoginDiv').style.display = 'none';
      document.getElementById('adminReportDiv').style.display = 'none';
      document.getElementById('homeDiv').style.display = 'block';
    }

    // ---------- Admin Login & Monthly Excel Report ----------
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'admin123';
    let isAdminLoggedIn = false;

    function openAdminLogin() {
      document.getElementById('homeDiv').style.display = 'none';
      if (isAdminLoggedIn) {
        openAdminReport();
        return;
      }
      document.getElementById('adminUser').value = '';
      document.getElementById('adminPass').value = '';
      document.getElementById('adminLoginError').textContent = '';
      document.getElementById('adminLoginDiv').style.display = 'block';
    }

    async function handleAdminLogin() {
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errEl = document.getElementById('adminLoginError');

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        isAdminLoggedIn = true;
        errEl.textContent = '';
        document.getElementById('adminLoginDiv').style.display = 'none';
        await openAdminReport();
      } else {
        errEl.textContent = 'Invalid username or password.';
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      showHome();
    }

    function getMonthlySummaryData() {
      const byMonth = {};
      orders.forEach(o => {
        const month = (o.date && String(o.date).length >= 7) ? String(o.date).slice(0, 7) : 'Unknown';
        if (!byMonth[month]) {
          byMonth[month] = { month, count: 0, laundry: 0, ironing: 0, total: 0 };
        }
        const amt = Number(o.amount) || 0;
        byMonth[month].count += 1;
        if (o.service === 'Ironing') {
          byMonth[month].ironing += amt;
        } else {
          byMonth[month].laundry += amt;
        }
        byMonth[month].total += amt;
      });
      return Object.values(byMonth).sort((a, b) => b.month.localeCompare(a.month));
    }

    async function openAdminReport() {
      document.getElementById('adminReportDiv').style.display = 'block';
      await loadOrders();
      renderMonthlyReport();
    }

    function renderMonthlyReport() {
      const container = document.getElementById('monthlyReportTable');
      const rows = getMonthlySummaryData();

      if (rows.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666;">No orders found.</p>';
        return;
      }

      let grandCount = 0;
      let grandLaundry = 0;
      let grandIroning = 0;
      let grandTotal = 0;

      let html = `
        <table class="report-table">
          <thead>
            <tr>
              <th>Month</th>
              <th>Orders</th>
              <th>Laundry (₹)</th>
              <th>Ironing (₹)</th>
              <th>Total (₹)</th>
            </tr>
          </thead>
          <tbody>
      `;

      rows.forEach(r => {
        grandCount += r.count;
        grandLaundry += r.laundry;
        grandIroning += r.ironing;
        grandTotal += r.total;
        html += `
          <tr>
            <td>${escapeHtml(r.month)}</td>
            <td>${r.count}</td>
            <td>${r.laundry.toFixed(2)}</td>
            <td>${r.ironing.toFixed(2)}</td>
            <td>${r.total.toFixed(2)}</td>
          </tr>
        `;
      });

      html += `
          <tr class="total-row">
            <td>Grand Total</td>
            <td>${grandCount}</td>
            <td>${grandLaundry.toFixed(2)}</td>
            <td>${grandIroning.toFixed(2)}</td>
            <td>${grandTotal.toFixed(2)}</td>
          </tr>
        </tbody>
      </table>
      `;
      container.innerHTML = html;
    }

    function exportMonthlyReportCSV() {
      const rows = getMonthlySummaryData();
      if (rows.length === 0) {
        alert('No data to export.');
        return;
      }
      const lines = ['Month,Orders,Laundry (INR),Ironing (INR),Total Earned (INR)'];
      let grandCount = 0, grandLaundry = 0, grandIroning = 0, grandTotal = 0;
      rows.forEach(r => {
        grandCount += r.count;
        grandLaundry += r.laundry;
        grandIroning += r.ironing;
        grandTotal += r.total;
        lines.push(`${r.month},${r.count},${r.laundry.toFixed(2)},${r.ironing.toFixed(2)},${r.total.toFixed(2)}`);
      });
      lines.push(`Grand Total,${grandCount},${grandLaundry.toFixed(2)},${grandIroning.toFixed(2)},${grandTotal.toFixed(2)}`);

      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'monthly-earnings-report.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function openOrderForm(service) {
      draftItems = [];
      await loadOrders();
      activeSlNo = computeNextSlNo();

      document.getElementById('homeDiv').style.display = 'none';
      const formDiv = document.getElementById('orderFormDiv');
      formDiv.style.display = 'block';
      const form = document.getElementById('orderForm');
      form.dataset.service = service;
      document.getElementById('formSlNo').textContent = `SL No: ${activeSlNo}`;
      document.getElementById('formTitle').textContent = `${service} Order`;
      currentClothList = (service === 'Ironing') ? ironingClothList : laundryClothList;
      form.reset();
      document.getElementById('unitPrice').textContent = '0';
      document.getElementById('itemSubtotal').textContent = '0.00';
      document.getElementById('totalAmount').textContent = '0.00';
      document.getElementById('customClothDiv').style.display = 'none';
      document.getElementById('rateDiv').style.display = 'none';
      document.getElementById('rateDC').checked = true;
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('orderDate').value = today;
      populateClothSelect();
      onClothChange();
      renderDraftItems();
    }

    async function openSearch() {
      document.getElementById('homeDiv').style.display = 'none';
      document.getElementById('searchDiv').style.display = 'block';
      document.getElementById('searchQuery').value = '';
      document.getElementById('searchResults').innerHTML = '';
      await loadOrders();
    }

    window.addEventListener('load', () => {
      loadOrders();
      populateClothSelect();
      document.getElementById('clothSelect').addEventListener('change', onClothChange);
      document.getElementById('quantity').addEventListener('input', computeTotal);
      document.getElementById('customPrice').addEventListener('input', computeTotal);
      document.querySelectorAll('input[name="rateOption"]').forEach(r => {
        r.addEventListener('change', handleRateChange);
      });
    });
  </script>
</head>

<body>
  <div id="homeDiv" class="container">
    <h1>Welcome</h1>
    <div id="dbStatus" class="status">Connecting to shared database...</div>
    <button class="primary" onclick="openOrderForm('Laundry')">Laundry</button>
    <button class="secondary" onclick="openOrderForm('Ironing')">Ironing</button>
    <input type="button" class="link" value="Search Orders" onclick="openSearch()">
    <input type="button" class="link" value="Admin Login (Monthly Report)" onclick="openAdminLogin()">
    <button class="danger" onclick="deleteOldOrders()">Clean Old Orders (45+ Days)</button>
  </div>

  <div id="orderFormDiv" class="container" style="display:none;">
    <div id="formSlNo" class="sl-badge">SL No: 100</div>
    <h2 id="formTitle" style="margin-top:0;"></h2>
    <form id="orderForm" class="field">
      <div class="field"><label>Customer Name</label><input type="text" id="custName"></div>
      <div class="field"><label>Mobile Number <span style="color:red">*</span></label><input type="text" id="custMobile"
          required></div>
      <div class="field"><label>Date</label><input type="date" id="orderDate" required></div>
      <div class="field"><label>Item</label><select id="clothSelect"></select></div>
      <div id="customClothDiv" class="field" style="display:none;">
        <label>Custom Item Name</label><input type="text" id="customName" placeholder="e.g., Silk Scarf">
        <label>Custom Unit Price (₹)</label><input type="number" step="0.01" id="customPrice" placeholder="e.g., 150">
      </div>
      <div id="rateDiv" class="field" style="display:none;">
        <label>Rate Type</label>
        <input type="radio" id="rateDC" name="rateOption" value="dc" checked> <label for="rateDC"
          class="inline-label">DC Rate</label>
        <input type="radio" id="ratePL" name="rateOption" value="pl"> <label for="ratePL" class="inline-label">PL
          Rate</label>
      </div>
      <div class="field"><label>Quantity</label><input type="number" id="quantity" min="1" value="1" required></div>
      <div class="field"><strong>Unit Price (₹): </strong><span id="unitPrice">0</span> • <strong>Item Subtotal (₹):
        </strong><span id="itemSubtotal">0.00</span></div>

      <button type="button" class="secondary" onclick="addItemToOrder()">+ Add Next Item</button>

      <div id="draftItemsBox" class="cart-box" style="display:none;">
        <div style="font-weight:bold; margin-bottom:6px;">Added Items in This Order:</div>
        <div id="draftItemsList"></div>
        <div style="margin-top:8px; font-weight:bold;">Items Total (₹): <span id="draftItemsTotal">0.00</span></div>
      </div>

      <div class="field total"><strong>Total Amount (₹): </strong><span id="totalAmount">0.00</span></div>
      <button type="button" class="primary" onclick="saveOrder()">Save Order</button>
      <input type="button" class="link" value="Back" onclick="showHome()">
    </form>
  </div>

  <div id="searchDiv" class="container" style="display:none;">
    <h2>Search Orders</h2>
    <input type="text" id="searchQuery" placeholder="Enter SL No., name, or mobile" oninput="performSearch()">
    <button class="primary" onclick="performSearch()">Search</button>
    <div id="searchResults" style="margin-top:12px;"></div>
    <input type="button" class="link" value="Back" onclick="showHome()">
  </div>

  <div id="receiptModal" class="receipt-modal" onclick="if(event.target === this) closeReceipt()">
    <div class="receipt-card">
      <div id="receiptSlNo" class="receipt-sl">SL No: 100</div>
      <h2 class="receipt-title">Receipt</h2>
      <div id="receiptBody"></div>
      <button type="button" class="primary" onclick="closeReceipt()" style="margin-top:14px;">Close</button>
    </div>
  </div>

  <div id="adminLoginDiv" class="container" style="display:none;">
    <h2>Admin Login</h2>
    <div class="field"><label>Username</label><input type="text" id="adminUser" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input type="password" id="adminPass" placeholder="Enter password"></div>
    <div id="adminLoginError" style="color:#e53935; font-size:13px; margin-bottom:8px;"></div>
    <button type="button" class="primary" onclick="handleAdminLogin()">Login</button>
    <input type="button" class="link" value="Back" onclick="showHome()">
  </div>

  <div id="adminReportDiv" class="container" style="display:none; max-width:560px;">
    <h2>Monthly Earnings Report</h2>
    <div id="monthlyReportTable" style="overflow-x:auto;"></div>
    <button type="button" class="success" onclick="exportMonthlyReportCSV()" style="margin-top:14px;">Export to Excel
      (CSV)</button>
    <button type="button" class="secondary" onclick="logoutAdmin()">Logout</button>
  </div>
</body>

</html>
