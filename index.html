<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3f51b5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Ironing">
  <link rel="manifest" href="manifest.json">
  <title>Laundry & Ironing App</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
      });
    }
  </script>
  <style>
    body {font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5;}
    .container {max-width:440px; margin:30px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1);}
    h1 {text-align:center; color:#3f51b5;}
    button, input[type=button] {width:100%; padding:12px; margin:8px 0; font-size:16px; border:none; border-radius:4px; cursor:pointer;}
    .primary {background:#3f51b5; color:#fff;}
    .secondary {background:#ff9800; color:#fff;}
    .success {background:#2e7d32; color:#fff;}
    .danger {background:#e53935; color:#fff; font-size:14px; padding:10px; margin-top:20px;}
    .small-btn {width:auto; padding:6px 10px; font-size:13px; margin:4px 4px 0 0; display:inline-block;}
    .link {background:none; color:#3f51b5; text-decoration:underline; padding:0;}
    .field {margin-bottom:12px;}
    label {display:block; margin-bottom:4px; font-weight:bold;}
    .inline-label {display:inline; font-weight:normal; margin-right:12px;}
    input, select, textarea {width:100%; padding:8px; box-sizing:border-box;}
    input[type=radio] {width:auto;}
    .total {font-weight:bold; margin-top:8px; font-size:17px;}
    .status {text-align:center; font-size:12px; color:#666; margin-bottom:10px;}
    .cart-box {border:1px solid #ddd; background:#fafafa; border-radius:6px; padding:10px; margin:12px 0;}
    .cart-item {display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #eee; font-size:14px;}
    .cart-item:last-child {border-bottom:none;}
    .remove-btn {background:#e53935; color:#fff; border:none; border:none; border-radius:4px; padding:4px 8px; font-size:12px; cursor:pointer; width:auto; margin:0;}
    .edit-panel {background:#f9fbe7; border:1px solid #cddc39; border-radius:6px; padding:10px; margin-top:8px;}
    .hint {font-size:12px; color:#555; margin:-4px 0 8px 0;}
    @media (max-width: 600px) {
      .container {margin:0; max-width:100%; min-height:100vh; border-radius:0; box-shadow:none;}
    }
  </style>
  <script>
    // ---------- Supabase Configuration ----------
    let orders = [];
    let draftItems = [];
    const supabaseUrl = "https://cfsaiqgvpopnlhagxvqa.supabase.co";
    const supabaseKey = "sb_publishable_3sWev9-qMw38MDdl1CeS4g_maISPvi4";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function loadOrders() {
      const statusEl = document.getElementById('dbStatus');
      if (statusEl) statusEl.textContent = 'Syncing with cloud database...';

      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error loading orders:', error);
        if (statusEl) statusEl.textContent = 'Sync error: ' + error.message;
      } else {
        orders = data || [];
        if (statusEl) statusEl.textContent = `Connected • ${orders.length} shared orders`;
        if (document.getElementById('searchDiv').style.display === 'block') {
          const currentQuery = document.getElementById('searchQuery').value.trim();
          if (currentQuery !== '') {
            performSearch();
          }
        }
      }
    }

    supabaseClient
      .channel('public:orders')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
        loadOrders();
      })
      .subscribe();

    async function saveOrderToSupabase(order) {
      const { error } = await supabaseClient
        .from('orders')
        .insert([order]);

      if (error) {
        console.error('Error saving order:', error);
        alert('Failed to save to cloud database: ' + error.message);
      } else {
        await loadOrders();
        alert('Order saved to shared database!');
        showHome();
      }
    }

    async function deleteOldOrders() {
      const cutoffDate = new Date();
      cutoffDate.setDate(cutoffDate.getDate() - 30);
      const cutoffStr = cutoffDate.toISOString().split('T')[0];

      const confirmDelete = confirm(
        `This will permanently delete all orders dated before ${cutoffStr} (strictly older than 30 days).\n\nDo you want to continue?`
      );
      if (!confirmDelete) return;

      const { data, error } = await supabaseClient
        .from('orders')
        .delete()
        .lt('date', cutoffStr)
        .select();

      if (error) {
        console.error('Error deleting old orders:', error);
        alert('Failed to delete old orders: ' + error.message);
      } else {
        const deletedCount = data ? data.length : 0;
        alert(`Cleanup complete! Deleted ${deletedCount} order(s) older than 30 days.`);
        await loadOrders();
      }
    }

    // ---------- Item lists ----------
    const laundryClothList = [
      {name:'Shirt', dc:90, pl:60},
      {name:'Juba Polyster', dc:150, pl:100},
      {name:'Dhothi', dc:80, pl:60},
      {name:'Pants', dc:90, pl:70},
      {name:'Saree', dc:150, pl:120},
      {name:'Kerala Set Mundu', dc:150, pl:120},
      {name:'Blouse', dc:50, pl:35},
      {name:'Under Skirt', dc:60, pl:30},
      {name:'Under garments', dc:60, pl:30},
      {name:'Salwar Kammes Set', dc:150, pl:100},
      {name:'Salwar Kammes Top', dc:90, pl:60},
      {name:'Salwar Karnmes Bottom', dc:50, pl:30},
      {name:'Salwar Kammes Shawl', dc:60, pl:30},
      {name:'Nighty', dc:60, pl:30},
      {name:'Bed Sheet Single', dc:75, pl:60},
      {name:'Bed Sheet Double', dc:90, pl:80},
      {name:'Piliow Case', dc:40, pl:30},
      {name:'Bath Toweis', dc:40, pl:30},
      {name:'Curtains Single / Panel', dc:150, pl:125},
      {name:'Curtains double / Panel with Lining', dc:200, pl:175},
      {name:'Blankets Single', dc:210, pl:125},
      {name:'Blankets Double', dc:250, pl:175},
      {name:'Comforter', dc:225, pl:175},
      {name:'Other services', dc:210, pl:0},
      {name:'Others', price:0}
    ];
    const ironingClothList = [
      {name:'Saree', price:40},
      {name:'Pant', price:20},
      {name:'Shirt', price:20},
      {name:'Churidar', price:35},
      {name:'Top', price:20},
      {name:'Jeans', price:20},
      {name:'Blouse', price:15},
      {name:'Dothi', price:20},
      {name:'Suit', price:50},
      {name:'Others', price:0}
    ];
    let currentClothList = laundryClothList;

    function populateClothSelect() {
      const select = document.getElementById('clothSelect');
      select.innerHTML = '';
      currentClothList.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.name;
        select.appendChild(opt);
      });
    }

    function getCurrentItemSelection() {
      const cloth = document.getElementById('clothSelect').value;
      const customName = document.getElementById('customName').value.trim();
      const customPrice = parseFloat(document.getElementById('customPrice').value) || 0;
      const quantity = parseInt(document.getElementById('quantity').value) || 0;

      let materialDesc = cloth;
      let unitPrice = 0;

      if (cloth === 'Others') {
        materialDesc = customName || 'Other';
        unitPrice = customPrice;
      } else {
        const item = currentClothList.find(c => c.name === cloth);
        if (item && ('dc' in item)) {
          const selectedRate = document.querySelector('input[name="rateOption"]:checked').value;
          unitPrice = selectedRate === 'dc' ? item.dc : item.pl;
          materialDesc = `${cloth} (${selectedRate.toUpperCase()})`;
        } else {
          unitPrice = item ? item.price : 0;
        }
      }

      return {
        material: materialDesc,
        quantity,
        unitPrice,
        amount: unitPrice * quantity
      };
    }

    function handleRateChange() {
      const select = document.getElementById('clothSelect');
      if (select.value === 'Others') return;
      const item = currentClothList.find(c => c.name === select.value);
      const selectedRate = document.querySelector('input[name="rateOption"]:checked').value;
      const price = selectedRate === 'dc' ? item.dc : item.pl;
      document.getElementById('unitPrice').textContent = price !== undefined ? price : '0';
      computeTotal();
    }

    function onClothChange() {
      const select = document.getElementById('clothSelect');
      const chosen = select.value;
      const customDiv = document.getElementById('customClothDiv');
      const rateDiv = document.getElementById('rateDiv');
      const priceSpan = document.getElementById('unitPrice');

      if (chosen === 'Others') {
        customDiv.style.display = 'block';
        rateDiv.style.display = 'none';
        priceSpan.textContent = document.getElementById('customPrice').value || '0';
      } else {
        customDiv.style.display = 'none';
        const item = currentClothList.find(c => c.name === chosen);
        if (item && ('dc' in item)) {
          rateDiv.style.display = 'block';
          const selectedRate = document.querySelector('input[name="rateOption"]:checked').value;
          const price = selectedRate === 'dc' ? item.dc : item.pl;
          priceSpan.textContent = price !== undefined ? price : '0';
        } else {
          rateDiv.style.display = 'none';
          priceSpan.textContent = item ? item.price : '0';
        }
      }
      computeTotal();
    }

    function computeTotal() {
      const qty = parseInt(document.getElementById('quantity').value) || 0;
      if (document.getElementById('clothSelect').value === 'Others') {
        document.getElementById('unitPrice').textContent = document.getElementById('customPrice').value || '0';
      }
      const unitPrice = parseFloat(document.getElementById('unitPrice').textContent) || 0;
      const currentItemTotal = qty * unitPrice;
      document.getElementById('itemSubtotal').textContent = isNaN(currentItemTotal) ? '0.00' : currentItemTotal.toFixed(2);

      const addedItemsTotal = draftItems.reduce((sum, it) => sum + it.amount, 0);
      const grandTotal = addedItemsTotal + (draftItems.length === 0 ? currentItemTotal : 0);
      document.getElementById('totalAmount').textContent = isNaN(grandTotal) ? '0.00' : grandTotal.toFixed(2);
    }

    function renderDraftItems() {
      const listEl = document.getElementById('draftItemsList');
      const boxEl = document.getElementById('draftItemsBox');
      listEl.innerHTML = '';

      if (draftItems.length === 0) {
        boxEl.style.display = 'none';
        computeTotal();
        return;
      }

      boxEl.style.display = 'block';
      draftItems.forEach((it, index) => {
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <span><strong>${it.material}</strong> × ${it.quantity} @ ₹${it.unitPrice} = <strong>₹${it.amount.toFixed(2)}</strong></span>
          <button type="button" class="remove-btn" onclick="removeDraftItem(${index})">Remove</button>
        `;
        listEl.appendChild(row);
      });

      const addedTotal = draftItems.reduce((sum, it) => sum + it.amount, 0);
      document.getElementById('draftItemsTotal').textContent = addedTotal.toFixed(2);
      document.getElementById('totalAmount').textContent = addedTotal.toFixed(2);
    }

    function addItemToOrder() {
      const sel = getCurrentItemSelection();
      if (!sel.material || sel.quantity <= 0) {
        alert('Please select a valid item and enter quantity > 0.');
        return;
      }
      if (document.getElementById('clothSelect').value === 'Others' && sel.unitPrice <= 0) {
        alert('Please enter a custom unit price > 0.');
        return;
      }

      draftItems.push(sel);
      document.getElementById('customName').value = '';
      document.getElementById('customPrice').value = '';
      document.getElementById('quantity').value = 1;
      onClothChange();
      renderDraftItems();
    }

    function removeDraftItem(index) {
      draftItems.splice(index, 1);
      renderDraftItems();
    }

    function formatCombinedOrder(items) {
      if (items.length === 1) {
        return {
          material: items[0].material,
          quantity: items[0].quantity,
          unitPrice: items[0].unitPrice,
          amount: items[0].amount
        };
      }
      const combinedMaterial = items.map(i => `${i.material} (${i.quantity}×₹${i.unitPrice})`).join(', ');
      const totalQty = items.reduce((sum, i) => sum + i.quantity, 0);
      const totalAmount = items.reduce((sum, i) => sum + i.amount, 0);
      const avgUnitPrice = totalQty > 0 ? Number((totalAmount / totalQty).toFixed(2)) : 0;
      return {
        material: combinedMaterial,
        quantity: totalQty,
        unitPrice: avgUnitPrice,
        amount: totalAmount
      };
    }

    async function saveOrder() {
      const service = document.getElementById('orderForm').dataset.service;
      const name = document.getElementById('custName').value.trim();
      const mobile = document.getElementById('custMobile').value.trim();
      const date = document.getElementById('orderDate').value;

      let itemsToSave = [...draftItems];
      if (itemsToSave.length === 0) {
        const current = getCurrentItemSelection();
        if (!current.material || current.quantity <= 0) {
          alert('Please fill all required fields and ensure quantity is > 0');
          return;
        }
        itemsToSave.push(current);
      }

      if (!name || !mobile || !date) {
        alert('Please enter Customer Name, Mobile Number, and Date.');
        return;
      }

      const summary = formatCombinedOrder(itemsToSave);
      const order = {
        id: Date.now(),
        service,
        name,
        mobile,
        date,
        material: summary.material,
        quantity: summary.quantity,
        unitPrice: summary.unitPrice,
        amount: summary.amount
      };

      await saveOrderToSupabase(order);
    }

    // Parses strings like "Saree (3×₹40), Pant (1×₹20)" into structured items
    function parseBreakdownFromMaterial(materialStr) {
      if (!materialStr) return null;
      const parts = materialStr.split(',').map(p => p.trim()).filter(Boolean);
      if (parts.length === 0) return null;

      const parsed = [];
      for (const part of parts) {
        const match = part.match(/^(.*?)\s*\(\s*(\d+)\s*[×x*]\s*₹?\s*(\d+(?:\.\d+)?)\s*\)$/i);
        if (!match) return null;
        parsed.push({
          name: match[1].trim(),
          qty: parseInt(match[2], 10),
          price: parseFloat(match[3])
        });
      }
      return parsed;
    }

    function calculateEditedOrderValues(materialStr, fallbackQty, fallbackUnitPrice) {
      const parsedItems = parseBreakdownFromMaterial(materialStr);
      if (parsedItems && parsedItems.length > 0) {
        const totalQty = parsedItems.reduce((sum, it) => sum + it.qty, 0);
        const totalAmount = Number(parsedItems.reduce((sum, it) => sum + (it.qty * it.price), 0).toFixed(2));
        const avgUnitPrice = totalQty > 0 ? Number((totalAmount / totalQty).toFixed(2)) : 0;
        return {
          hasBreakdown: true,
          quantity: totalQty,
          unitPrice: avgUnitPrice,
          amount: totalAmount
        };
      }

      const qty = parseInt(fallbackQty, 10) || 0;
      const unitPrice = parseFloat(fallbackUnitPrice) || 0;
      const amount = Number((qty * unitPrice).toFixed(2));
      return {
        hasBreakdown: false,
        quantity: qty,
        unitPrice,
        amount
      };
    }

    function performSearch() {
      const q = document.getElementById('searchQuery').value.trim().toLowerCase();
      const container = document.getElementById('searchResults');
      container.innerHTML = '';

      if (q === '') {
        container.textContent = 'Enter a name or mobile number to search.';
        return;
      }

      const results = orders.filter(o => {
        const name = (o.name || '').toLowerCase();
        const mobile = (o.mobile || '').toLowerCase();
        return name.includes(q) || mobile.includes(q);
      });

      if (results.length === 0) {
        container.textContent = 'No matching orders found.';
        return;
      }

      results.forEach(o => {
        const div = document.createElement('div');
        div.style.border = '1px solid #ccc';
        div.style.borderRadius = '6px';
        div.style.padding = '10px';
        div.style.marginBottom = '10px';
        const amountStr = (o.amount !== undefined && o.amount !== null) ? Number(o.amount).toFixed(2) : '0.00';
        const currentUnitPrice = (o.unitPrice !== undefined && o.unitPrice !== null)
          ? o.unitPrice
          : ((o.unit_price !== undefined && o.unit_price !== null) ? o.unit_price : 0);
        const hasBreakdown = Boolean(parseBreakdownFromMaterial(o.material));

        div.innerHTML = `
          <strong>${o.name}</strong> – ${o.mobile}<br>
          ${o.service} on ${o.date}<br>
          ${o.material} • Count: <strong>${o.quantity}</strong> = <strong>₹${amountStr}</strong><br>
          <button type="button" class="small-btn primary" onclick="showReceipt(${o.id})">View Receipt</button>
          <button type="button" class="small-btn secondary" onclick="toggleEditOrder(${o.id})">Edit Count / Order</button>
          <div id="editBox-${o.id}" class="edit-panel" style="display:none;">
            <label style="font-size:13px;">Items / Material</label>
            <input type="text" id="editMaterial-${o.id}" value="${escapeHtml(o.material)}" oninput="syncEditInputs(${o.id})" style="margin-bottom:4px;">
            <div class="hint">Tip: Change any count inside parentheses, e.g. Saree (1×₹40) → Saree (3×₹40), to recalculate the price automatically.</div>
            <label style="font-size:13px;">Cloth Count (Quantity)</label>
            <input type="number" id="editQty-${o.id}" min="1" value="${o.quantity}" ${hasBreakdown ? 'readonly style="background:#eee; margin-bottom:8px;"' : 'style="margin-bottom:8px;"'} oninput="previewEditedAmount(${o.id})">
            <div id="editUnitPriceWrap-${o.id}" style="${hasBreakdown ? 'display:none;' : ''} margin-bottom:8px;">
              <label style="font-size:13px;">Unit Price (₹)</label>
              <input type="number" step="0.01" id="editUnitPrice-${o.id}" min="0" value="${currentUnitPrice}" oninput="previewEditedAmount(${o.id})">
            </div>
            <div style="font-size:14px; margin-bottom:8px;">
              <strong>Updated Amount (₹): </strong><span id="editPreviewAmount-${o.id}">${amountStr}</span>
            </div>
            <button type="button" class="small-btn success" onclick="saveEditedOrder(${o.id})">Save Changes</button>
            <button type="button" class="small-btn" onclick="toggleEditOrder(${o.id})">Cancel</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function toggleEditOrder(id) {
      const box = document.getElementById(`editBox-${id}`);
      if (!box) return;
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      if (box.style.display === 'block') {
        syncEditInputs(id);
      }
    }

    function syncEditInputs(id) {
      const materialVal = document.getElementById(`editMaterial-${id}`).value;
      const qtyInput = document.getElementById(`editQty-${id}`);
      const unitWrap = document.getElementById(`editUnitPriceWrap-${id}`);
      const unitInput = document.getElementById(`editUnitPrice-${id}`);

      const calc = calculateEditedOrderValues(materialVal, qtyInput.value, unitInput.value);
      if (calc.hasBreakdown) {
        qtyInput.value = calc.quantity;
        qtyInput.readOnly = true;
        qtyInput.style.background = '#eee';
        unitWrap.style.display = 'none';
        unitInput.value = calc.unitPrice;
        document.getElementById(`editPreviewAmount-${id}`).textContent = calc.amount.toFixed(2);
      } else {
        qtyInput.readOnly = false;
        qtyInput.style.background = '#fff';
        unitWrap.style.display = 'block';
        previewEditedAmount(id);
      }
    }

    function previewEditedAmount(id) {
      const materialVal = document.getElementById(`editMaterial-${id}`).value;
      const qtyInput = document.getElementById(`editQty-${id}`);
      const unitInput = document.getElementById(`editUnitPrice-${id}`);
      const calc = calculateEditedOrderValues(materialVal, qtyInput.value, unitInput.value);
      document.getElementById(`editPreviewAmount-${id}`).textContent = isNaN(calc.amount) ? '0.00' : calc.amount.toFixed(2);
    }

    async function saveEditedOrder(id) {
      const newMaterial = document.getElementById(`editMaterial-${id}`).value.trim();
      const rawQty = document.getElementById(`editQty-${id}`).value;
      const rawUnitPrice = document.getElementById(`editUnitPrice-${id}`).value;

      const calc = calculateEditedOrderValues(newMaterial, rawQty, rawUnitPrice);

      if (!newMaterial || calc.quantity <= 0 || isNaN(calc.unitPrice) || calc.unitPrice < 0 || isNaN(calc.amount)) {
        alert('Please enter valid item details, a count greater than 0, and a valid price.');
        return;
      }

      const targetOrder = orders.find(x => String(x.id) === String(id));
      const matchId = targetOrder ? targetOrder.id : id;
      const usesSnakeCaseUnitPrice = targetOrder && ('unit_price' in targetOrder) && !('unitPrice' in targetOrder);

      const updatePayload = {
        material: newMaterial,
        quantity: calc.quantity,
        amount: calc.amount
      };
      if (usesSnakeCaseUnitPrice) {
        updatePayload.unit_price = calc.unitPrice;
      } else {
        updatePayload.unitPrice = calc.unitPrice;
      }

      const { data, error } = await supabaseClient
        .from('orders')
        .update(updatePayload)
        .eq('id', matchId)
        .select();

      if (error) {
        console.error('Error updating order:', error);
        alert('Failed to update order: ' + error.message);
        return;
      }

      if (!data || data.length === 0) {
        alert('Update did not save to Supabase (0 rows matched or UPDATE permission is blocked by Row Level Security). Check your Supabase UPDATE policy on the orders table.');
        return;
      }

      await loadOrders();
      alert(`Order updated! New count: ${calc.quantity}, New amount: ₹${calc.amount.toFixed(2)}`);
    }

    function showReceipt(id) {
      const o = orders.find(x => x.id === id);
      if (!o) return;
      alert(`Receipt\n\nService: ${o.service}\nName: ${o.name}\nMobile: ${o.mobile}\nDate: ${o.date}\nItem(s): ${o.material}\nCount / Quantity: ${o.quantity}\nAmount: ₹${Number(o.amount).toFixed(2)}`);
    }

    function showHome() {
      document.getElementById('orderFormDiv').style.display = 'none';
      document.getElementById('searchDiv').style.display = 'none';
      document.getElementById('homeDiv').style.display = 'block';
    }

    function openOrderForm(service) {
      draftItems = [];
      document.getElementById('homeDiv').style.display = 'none';
      const formDiv = document.getElementById('orderFormDiv');
      formDiv.style.display = 'block';
      const form = document.getElementById('orderForm');
      form.dataset.service = service;
      document.getElementById('formTitle').textContent = `${service} Order`;
      currentClothList = (service === 'Ironing') ? ironingClothList : laundryClothList;
      form.reset();
      document.getElementById('unitPrice').textContent = '0';
      document.getElementById('itemSubtotal').textContent = '0.00';
      document.getElementById('totalAmount').textContent = '0.00';
      document.getElementById('customClothDiv').style.display = 'none';
      document.getElementById('rateDiv').style.display = 'none';
      document.getElementById('rateDC').checked = true;
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('orderDate').value = today;
      populateClothSelect();
      onClothChange();
      renderDraftItems();
    }

    async function openSearch() {
      document.getElementById('homeDiv').style.display = 'none';
      document.getElementById('searchDiv').style.display = 'block';
      document.getElementById('searchQuery').value = '';
      document.getElementById('searchResults').innerHTML = '';
      await loadOrders();
    }

    window.addEventListener('load', () => {
      loadOrders();
      populateClothSelect();
      document.getElementById('clothSelect').addEventListener('change', onClothChange);
      document.getElementById('quantity').addEventListener('input', computeTotal);
      document.getElementById('customPrice').addEventListener('input', computeTotal);
      document.querySelectorAll('input[name="rateOption"]').forEach(r => {
        r.addEventListener('change', handleRateChange);
      });
    });
  </script>
</head>
<body>
  <div id="homeDiv" class="container">
    <h1>Welcome</h1>
    <div id="dbStatus" class="status">Connecting to shared database...</div>
    <button class="primary" onclick="openOrderForm('Laundry')">Laundry</button>
    <button class="secondary" onclick="openOrderForm('Ironing')">Ironing</button>
    <input type="button" class="link" value="Search Orders" onclick="openSearch()">
    <button class="danger" onclick="deleteOldOrders()">Clean Old Orders (30+ Days)</button>
  </div>

  <div id="orderFormDiv" class="container" style="display:none;">
    <h2 id="formTitle"></h2>
    <form id="orderForm" class="field">
      <div class="field"><label>Customer Name</label><input type="text" id="custName"></div>
      <div class="field"><label>Mobile Number <span style="color:red">*</span></label><input type="text" id="custMobile" required></div>
      <div class="field"><label>Date</label><input type="date" id="orderDate" required></div>
      <div class="field"><label>Item</label><select id="clothSelect"></select></div>
      <div id="customClothDiv" class="field" style="display:none;">
        <label>Custom Item Name</label><input type="text" id="customName" placeholder="e.g., Silk Scarf">
        <label>Custom Unit Price (₹)</label><input type="number" step="0.01" id="customPrice" placeholder="e.g., 150">
      </div>
      <div id="rateDiv" class="field" style="display:none;">
        <label>Rate Type</label>
        <input type="radio" id="rateDC" name="rateOption" value="dc" checked> <label for="rateDC" class="inline-label">DC Rate</label>
        <input type="radio" id="ratePL" name="rateOption" value="pl"> <label for="ratePL" class="inline-label">PL Rate</label>
      </div>
      <div class="field"><label>Quantity</label><input type="number" id="quantity" min="1" value="1" required></div>
      <div class="field"><strong>Unit Price (₹): </strong><span id="unitPrice">0</span> • <strong>Item Subtotal (₹): </strong><span id="itemSubtotal">0.00</span></div>

      <button type="button" class="secondary" onclick="addItemToOrder()">+ Add Next Item</button>

      <div id="draftItemsBox" class="cart-box" style="display:none;">
        <div style="font-weight:bold; margin-bottom:6px;">Added Items in This Order:</div>
        <div id="draftItemsList"></div>
        <div style="margin-top:8px; font-weight:bold;">Items Total (₹): <span id="draftItemsTotal">0.00</span></div>
      </div>

      <div class="field total"><strong>Total Amount (₹): </strong><span id="totalAmount">0.00</span></div>
      <button type="button" class="primary" onclick="saveOrder()">Save Order</button>
      <input type="button" class="link" value="Back" onclick="showHome()">
    </form>
  </div>

  <div id="searchDiv" class="container" style="display:none;">
    <h2>Search Orders</h2>
    <input type="text" id="searchQuery" placeholder="Enter name or mobile" oninput="performSearch()">
    <button class="primary" onclick="performSearch()">Search</button>
    <div id="searchResults" style="margin-top:12px;"></div>
    <input type="button" class="link" value="Back" onclick="showHome()">
  </div>
</body>
</html>
